name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  claude-review:
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      # write: the review is posted as PR comments (summary + inline).
      pull-requests: write
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}  # PROBE ONLY: skips the app-token workflow check
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: |
            /code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }} --comment

            Project-specific checks for this repository, in addition to the
            standard review. CLAUDE.md states these as invariants; flag any
            change that violates one.

            - Output writes must go through AtomicFileWriter. The only exception
              is geo-vector formats (geojson/gpkg/shp).
            - ROI-to-partition selection must expand by one H3 ring
              (h3_expand_ring / gh3_select_partitions). Exact polygon
              intersection silently drops boundary shots.
            - parallel_map raises when no dask Client is registered; call sites
              must not assume a serial fallback.
            - No client.scatter in the build drivers.
            - New imports must be declared in pyproject.toml. osgeo is the only
              permitted optional import and needs a guarded call site.
            - A new [project.scripts] entry point must also be documented in
              docs/user-guide/cli-reference.md and mirrored in the conda-forge
              feedstock's entry_points, which CI does not check.
            - No hand-maintained counts or file inventories in documentation.
          # Headless runs deny any tool not allowed here. The plugin fans out
          # subagents (Agent), reads the PR with gh, and posts with gh pr
          # comment / the inline-comment MCP tool.
          claude_args: |
            --allowedTools "Agent,Task,Read,Grep,Glob,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),Bash(gh pr list:*),Bash(gh issue view:*),Bash(gh issue list:*),Bash(gh search:*),mcp__github_inline_comment__create_inline_comment"
          # Claude's final report in the job summary (trusted input only:
          # pull_request runs from forks get no secrets).
          display_report: true
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

