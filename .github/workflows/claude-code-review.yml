name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

# One review per PR at a time: a quick push after opening must not race the
# first run past the plugin's "already commented" check.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    # Fork PRs get no secrets or OIDC here and would only fail red.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The review posts with the Claude App token from the OIDC exchange, whose
    # permissions the action requests itself; this job's own token stays read-only.
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        env:
          # Strip credentials (the OAuth token) from the shells Claude starts:
          # the plugin reads PR comments, which anyone can write, so an
          # injected command must find nothing to exfiltrate. GitHub tokens stay.
          CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: "1"
          # Run subagents in the foreground. Claude Code otherwise starts the
          # plugin's first subagent in the background and ends its turn to
          # wait for it, which ends this headless session ~6 s in, with
          # nothing reviewed or posted.
          CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: "1"
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: |
            /code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }} --comment

            Project-specific checks for this repository, in addition to the
            standard review. CLAUDE.md states these as invariants; flag any
            change that violates one.

            - Output writes must go through AtomicFileWriter. The only exception
              is geo-vector formats (geojson/gpkg/shp).
            - ROI-to-partition selection must expand by one H3 ring
              (h3_expand_ring / gh3_select_partitions). Exact polygon
              intersection silently drops boundary shots.
            - parallel_map raises when no dask Client is registered; call sites
              must not assume a serial fallback.
            - No client.scatter in the build drivers.
            - New imports must be declared in pyproject.toml. osgeo is the only
              permitted optional import and needs a guarded call site.
            - A new [project.scripts] entry point must also be documented in
              docs/user-guide/cli-reference.md and mirrored in the conda-forge
              feedstock's entry_points, which CI does not check.
            - No hand-maintained counts or file inventories in documentation.
          # Headless runs deny any tool not allowed here. The plugin fans out
          # subagents (Agent), reads the PR with gh, and posts with gh pr
          # comment / the inline-comment MCP tool (which the action installs
          # only when it is listed). Reads inside the checkout need no rule.
          claude_args: |
            --allowedTools "Agent,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),Bash(gh pr list:*),Bash(gh issue view:*),Bash(gh issue list:*),Bash(gh search:*),mcp__github_inline_comment__create_inline_comment"
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

